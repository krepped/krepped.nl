<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 400" width="1360" height="400" role="img" aria-label="I&#x27;m Krep, a full-stack developer from the Netherlands. I take projects all the way, from the first sketch to the servers they run on. The part I care about most comes after the demo: turning something that works into something people rely on.">
  <style>
    @font-face { font-family: "head"; font-weight: 300; src: url(data:font/woff2;base64,) format("woff2"); }
    @font-face { font-family: "mono"; font-weight: 400; src: url(data:font/woff2;base64,) format("woff2"); }
    .m, .n { font-family: "mono", ui-monospace, monospace; }
    .m { font-size: 16px; letter-spacing: 3.2px; }
    .n { font-size: 14px; letter-spacing: 1px; }
    .h { font-family: "head", "Helvetica Neue", Arial, sans-serif; font-weight: 300; }
    .t { font-family: "text", "Helvetica Neue", Arial, sans-serif; font-size: 24px; }
    .bg { fill: #050607; } .bd { stroke: rgba(201,208,210,0.12); } .ln { stroke: rgba(201,208,210,0.16); } .m { fill: #7b8588; } .n { fill: #5d676b; } .t { fill: #c9d0d2; } .h, .s { fill: #e8edef; } .ar { stroke: #e8edef; }
    @media (prefers-color-scheme: light) { .bg { fill: #c9d0d2; } .bd { stroke: rgba(10,12,13,0.08); } .ln { stroke: rgba(10,12,13,0.18); } .m { fill: #4b5457; } .n { fill: #6b7579; } .t { fill: #0a0c0d; } .h, .s { fill: #000000; } .ar { stroke: #000000; } }
  </style>
  <clipPath id="card"><rect width="1360" height="400" rx="18"/></clipPath>
  <g clip-path="url(#card)">
    <rect class="bg" width="1360" height="400"/>
    <text class="m" x="48" y="60">01 / ABOUT</text>
    <text class="h" x="46" y="140" font-size="42" letter-spacing="-1.05">I'm Krep, a full-stack developer from the Netherlands.</text>
    <text class="h" x="46" y="190" font-size="42" letter-spacing="-1.05">I take projects all the way, from the first sketch to the</text>
    <text class="h" x="46" y="240" font-size="42" letter-spacing="-1.05">servers they run on. The part I care about most comes</text>
    <text class="h" x="46" y="290" font-size="42" letter-spacing="-1.05">after the demo: turning something that works into</text>
    <text class="h" x="46" y="340" font-size="42" letter-spacing="-1.05">something people rely on.</text>
  </g>
  <rect class="bd" x="0.5" y="0.5" width="1359" height="399" rx="17.5" fill="none"/>
</svg>
