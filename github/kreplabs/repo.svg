<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 572" width="1360" height="572" role="img" aria-label="This repo: one static page, no build step. index.html: The whole page: markup, styles and scripts in one file. favicon.svg: The two-bar mark. CNAME: Points GitHub Pages at kreplabs.com. .nojekyll: Has GitHub Pages serve the files exactly as they are.">
  <style>
    @font-face { font-family: "hg"; font-weight: 600; src: url(data:font/woff2;base64,) format("woff2"); }
    @font-face { font-family: "hg"; font-weight: 700; src: url(data:font/woff2;base64,) format("woff2"); }
    @font-face { font-family: "mono"; font-weight: 500; src: url(data:font/woff2;base64,) format("woff2"); }
    @font-face { font-family: "hg"; font-weight: 500; src: url(data:font/woff2;base64,) format("woff2"); }
    text { font-family: "hg", "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: "mono", ui-monospace, Menlo, monospace; font-weight: 500; }
    .eb { font-size: 22px; font-weight: 600; fill: #f6a637; }
  </style>
  <clipPath id="card"><rect width="1360" height="572" rx="28"/></clipPath>
  <g clip-path="url(#card)">
    <rect width="1360" height="572" fill="#141414"/>
    <text class="eb" x="72" y="88">This repo</text>
    <text x="68" y="166" font-size="60" font-weight="700" letter-spacing="-2" fill="#f5f5f5">One static page. No build step.</text>
    <line x1="72" y1="232" x2="1288" y2="232" stroke="rgba(255,255,255,0.10)"/>
    <text class="mono" x="72" y="279" font-size="26" fill="#f5f5f5">index.html</text>
    <text x="400" y="279" font-size="26" font-weight="500" fill="#9a9a9a">The whole page: markup, styles and scripts in one file.</text>
    <line x1="72" y1="306" x2="1288" y2="306" stroke="rgba(255,255,255,0.10)"/>
    <text class="mono" x="72" y="353" font-size="26" fill="#f5f5f5">favicon.svg</text>
    <text x="400" y="353" font-size="26" font-weight="500" fill="#9a9a9a">The two-bar mark.</text>
    <line x1="72" y1="380" x2="1288" y2="380" stroke="rgba(255,255,255,0.10)"/>
    <text class="mono" x="72" y="427" font-size="26" fill="#f5f5f5">CNAME</text>
    <text x="400" y="427" font-size="26" font-weight="500" fill="#9a9a9a">Points GitHub Pages at kreplabs.com.</text>
    <line x1="72" y1="454" x2="1288" y2="454" stroke="rgba(255,255,255,0.10)"/>
    <text class="mono" x="72" y="501" font-size="26" fill="#f5f5f5">.nojekyll</text>
    <text x="400" y="501" font-size="26" font-weight="500" fill="#9a9a9a">Has GitHub Pages serve the files exactly as they are.</text>
    <line x1="72" y1="528" x2="1288" y2="528" stroke="rgba(255,255,255,0.10)"/>
  </g>
  <rect x="0.5" y="0.5" width="1359" height="571" rx="27.5" fill="none" stroke="rgba(255,255,255,0.10)"/>
</svg>
